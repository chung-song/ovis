name: Native review validation
on:
  push:
    branches:
      - validation/native-ci-3767
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-linux:
    if: github.repository == 'chung-song/ovis'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch the unchanged PR head
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source fetch --depth 1 https://github.com/chung-song/ovis.git 1b10e8ac6f9e24548d8510ec4fbf7caa50cdc602
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 1b10e8ac6f9e24548d8510ec4fbf7caa50cdc602
          git -C source remote add origin https://github.com/devswha/ovis.git
          git -C source fetch --depth 1 origin 86214b43ccbff03b6d7a11fc9512a5c273d95fa9
          git -C source update-ref refs/remotes/origin/main FETCH_HEAD
          git -C source fetch --no-tags --depth=1 origin refs/tags/v0.5.6:refs/tags/v0.5.6 refs/tags/v0.5.7:refs/tags/v0.5.7
          git -C source cat-file -e acab7685663bebc0ce2e93c75b4e3c4048d9f0bb^{commit}
          git -C source cat-file -e c482ad601132ebb80c0013f9d9063d474eac96c1^{commit}
      - name: Build the repository CI runner image on native Linux x64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sha256sum source/scripts/self-hosted-runner/Dockerfile
          docker build --platform linux/amd64 -t ovis-native-review source/scripts/self-hosted-runner
          docker image inspect ovis-native-review --format '{{.Id}} {{.Architecture}} {{.Config.User}}'
      - name: Validate the unchanged PR in its CI image
        shell: bash
        run: |
          set -euo pipefail
          mkdir results
          chmod 777 results
          docker run --rm --platform linux/amd64 --shm-size 2g --entrypoint /bin/bash \
            -e CI=1 -e RUNNER_ENVIRONMENT=self-hosted -e RATCHET_BASE=86214b43ccbff03b6d7a11fc9512a5c273d95fa9 \
            -v "$PWD/source:/source:ro" -v "$PWD/results:/results" \
            ovis-native-review -c '
              set -euo pipefail
              cp -a /source /w/review
              cd /w/review
              id
              uname -m
              bun --version
              node --version
              herdr --version
              git rev-parse HEAD
              bun install --frozen-lockfile --network-concurrency=8
              export CHROME_PATH="$(bash scripts/ci-chromium.sh)"
              bun scripts/demo-build.ts /w/demo
              export HERDR_DEMO_BUILD=/w/demo
              result=0
              run_check() {
                local name="$1"
                shift
                local status=0
                bun "$@" 2>&1 | tee "/results/$name.log" || status=$?
                printf "NATIVE_RESULT %s exit=%s\n" "$name" "$status"
                if [ "$status" -ne 0 ]; then result=1; fi
              }
              run_check drawer-modal-regression scripts/drawer-modal-regression.ts
              run_check inbox-mode-demo-regression scripts/inbox-mode-demo-regression.ts
              run_check mirror-scroll-demo-regression scripts/mirror-scroll-demo-regression.ts
              run_check mirror-fold-demo-regression scripts/mirror-fold-demo-regression.ts
              run_check chat-local-send-follow-demo-regression scripts/chat-local-send-follow-demo-regression.ts
              run_check phone-split-grid-demo-regression scripts/phone-split-grid-demo-regression.ts
              unset HERDR_DEMO_BUILD CHROME_PATH
              run_check focused test src/lib/edgeSwipe.test.ts src/lib/layoutScroll.test.ts src/lib/useSidebarLayout.hook.test.ts src/lib/terminalFold.test.ts src/components/ChatTimeline.test.tsx
              run_check fast-checks run check fast
              printf "NATIVE_OVERALL exit=%s\n" "$result"
              exit "$result"
            '
